#######################################################################
# Fern's Dotfiles -- Foot Terminal Emulator
# https://codeberg.org/fernzi/home
#######################################################################

[main]
font = monospace:size=12
pad = 12x12
resize-by-cells = no
initial-window-size-chars = 80x24

# Why can't this be relative?
include = ~/.config/foot/themes/kins.conf

[cursor]
style = underline

[mouse]
hide-when-typing = yes

[key-bindings]
pipe-command-output=[wl-copy] Control+Shift+g
color-theme-toggle = Control+Shift+t
